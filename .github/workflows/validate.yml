name: Validate graph data

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/validator/validate.py
      - run: python -m unittest discover -s tools/validator -p 'test_*.py'
      - run: git diff --check
