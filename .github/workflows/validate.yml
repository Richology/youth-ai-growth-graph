name: Validate graph data

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: python tools/validator/validate.py
      - run: python -m unittest discover -s tools/validator -p 'test_*.py'
      - run: python -m unittest tools/test_build_web_graph.py
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - run: npx playwright install --with-deps chromium
        working-directory: site
      - run: npm run test:e2e
        working-directory: site
      - run: git diff --check
